# Production overlay (mid). İmaj içindeki derlenmiş kaynak kullanılır
# (kaynak bind mount yok) ve NODE_ENV=production.
# hero'da gerçek çok aşamalı Dockerfile + postgres (outbox + prisma migrate)
# eklenir; o zaman bu dosya güncellenir.
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
services:
  api:
    command: ['sh', '-c', 'npm run start:api']
    environment:
      NODE_ENV: production
    volumes: []
  worker:
    command: ['sh', '-c', 'npm run start:worker']
    environment:
      NODE_ENV: production
    volumes: []
  notification:
    command: ['sh', '-c', 'npm run start:notification']
    environment:
      NODE_ENV: production
    volumes: []
