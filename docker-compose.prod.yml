# Production overlay. The app services run the compiled dist/ output from
# the multi-stage Dockerfile — no source bind mounts.
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orders-api
    command: ['node', 'dist/api/index.js']
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/orders?schema=public
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      RABBITMQ_EXCHANGE: orders
      # Change this before any non-local deployment.
      JWT_SECRET: dev-insecure-change-me
      # Optional: set to an OTLP HTTP endpoint to export traces.
      # OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orders-worker
    command: ['node', 'dist/worker/index.js']
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/orders?schema=public
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      RABBITMQ_EXCHANGE: orders
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  notification:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orders-notification
    command: ['node', 'dist/notification-worker/index.js']
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/orders?schema=public
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      RABBITMQ_EXCHANGE: orders
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  relay:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orders-relay
    command: ['node', 'dist/outbox-relay/index.js']
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/orders?schema=public
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      RABBITMQ_EXCHANGE: orders
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    # Run multiple replicas for throughput: `docker compose up -d --scale relay=N`,
    # or set a replica count here for Swarm / orchestrator deployments.
    deploy:
      replicas: 2
    restart: unless-stopped

  inventory:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orders-inventory
    command: ['node', 'dist/inventory-worker/index.js']
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/orders?schema=public
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      RABBITMQ_EXCHANGE: orders
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
