# Development overlay (auto-loaded by `docker compose up`).
# beginner: tek "app" servisi — api + worker aynı süreçte, in-memory store.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: orders-app
    command: sh -c 'npm run dev'
    environment:
      NODE_ENV: development
      PORT: 3000
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      RABBITMQ_EXCHANGE: orders
      STORE: in-memory
      TOPOLOGY: basic
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
