# Development overlay (auto-loaded by `docker compose up`).
# mid: redis + api/worker/notification ayrı servisler; kaynak kod bind mount
# (hot reload) ve NODE_ENV=development.
services:
  api:
    command: sh -c 'npm run dev:api'
    environment:
      NODE_ENV: development
    volumes:
      - .:/app
      - /app/node_modules
  worker:
    command: sh -c 'npm run dev:worker'
    environment:
      NODE_ENV: development
    volumes:
      - .:/app
      - /app/node_modules
  notification:
    command: sh -c 'npm run dev:notification'
    environment:
      NODE_ENV: development
    volumes:
      - .:/app
      - /app/node_modules
